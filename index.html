<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Smart Circularity Navigator</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f7f9f8;--panel:#ffffff;--ink:#18262b;--muted:#5b6b70;--line:#d8e0dd;--soft:#eef2f0;
  --accent:#0e6655;--accent-ink:#ffffff;--chance:#2f9a41;--risk:#cf463f;--zone:#e9eeeb;--warn:#8a5a00;
  --font:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
  color-scheme:light;box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0f171a;--panel:#162125;--ink:#e4ecea;--muted:#9aaba9;--line:#2a3a3e;--soft:#1c2a2e;
  --accent:#4cc2a6;--accent-ink:#0b1416;--chance:#5cc56c;--risk:#f06a62;--zone:#1d2b2f;--warn:#e3b45a;color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f171a;--panel:#162125;--ink:#e4ecea;--muted:#9aaba9;--line:#2a3a3e;--soft:#1c2a2e;
  --accent:#4cc2a6;--accent-ink:#0b1416;--chance:#5cc56c;--risk:#f06a62;--zone:#1d2b2f;--warn:#e3b45a;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:15px;line-height:1.5}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
button,input,textarea,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.top{display:flex;flex-wrap:wrap;align-items:center;gap:12px 20px;padding:18px 24px;border-bottom:1px solid var(--line);background:var(--panel)}
.brand{display:flex;align-items:center;gap:10px;font-weight:600;font-size:17px;letter-spacing:-.01em}
.brand svg{flex:none}
.context{color:var(--muted);font-size:14px;flex:1;min-width:200px}
.context b{color:var(--ink);font-weight:500}
.actions{display:flex;gap:8px;flex-wrap:wrap}
.btn{border:1px solid var(--line);background:var(--panel);border-radius:6px;padding:7px 12px;cursor:pointer;font-size:14px}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:500}
.btn.small{padding:4px 9px;font-size:13px}
.btn.ghost{border-color:transparent;background:transparent;color:var(--muted)}
a.btn{display:inline-block;text-decoration:none;color:var(--ink)}
a.btn.primary{color:var(--accent-ink)}
.layout{display:grid;grid-template-columns:230px minmax(0,1fr);max-width:1240px;margin:0 auto}
.rail{padding:24px 16px 24px 24px;position:sticky;top:env(safe-area-inset-top,0px);align-self:start}
.rail ol{list-style:none;margin:0;padding:0;counter-reset:step}
.rail li{margin:0 0 2px}
.rail a{display:grid;grid-template-columns:26px 1fr;gap:10px;align-items:start;padding:9px 10px;border-radius:8px;color:var(--ink);text-decoration:none}
.rail a:hover{background:var(--soft)}
.rail a[aria-current="step"]{background:var(--soft)}
.rail .num{width:26px;height:26px;border-radius:50%;border:1.5px solid var(--line);display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:600;font-variant-numeric:tabular-nums}
.rail a[aria-current="step"] .num{border-color:var(--accent);background:var(--accent);color:var(--accent-ink)}
.rail .done .num{border-color:var(--accent);color:var(--accent)}
.rail .lbl{font-weight:500;font-size:14.5px;line-height:1.25}
.rail .meta{display:block;color:var(--muted);font-size:12.5px;font-weight:400;margin-top:2px}
main{padding:28px 28px 64px;min-width:0}
h1{font-size:26px;line-height:1.2;letter-spacing:-.015em;margin:0 0 6px;font-weight:600}
.lead{color:var(--muted);margin:0 0 22px;max-width:70ch}
h2{font-size:17px;margin:28px 0 10px;font-weight:600}
h3{font-size:15px;margin:0;font-weight:600}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:18px 20px;margin:0 0 16px}
.field{display:flex;flex-direction:column;gap:4px;margin:0 0 14px;max-width:420px}
.field span{font-size:13px;color:var(--muted)}
input[type=text],textarea,select.sel{border:1px solid var(--line);border-radius:6px;padding:8px 10px;background:var(--panel);width:100%}
textarea{min-height:58px;resize:vertical}
.checks{display:flex;flex-wrap:wrap;gap:8px 18px}
.check{display:inline-flex;gap:8px;align-items:center;cursor:pointer;font-size:14.5px}
input[type=checkbox],input[type=radio]{accent-color:var(--accent);width:16px;height:16px}
.tablewrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:middle}
th{font-weight:500;color:var(--muted);font-size:13px}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
.bar{display:inline-block;height:6px;border-radius:3px;background:var(--accent);vertical-align:middle;margin-right:8px}
.faded{opacity:.45}
.note{font-size:13px;color:var(--muted)}
.warnnote{font-size:13px;color:var(--warn)}
.cat{margin:0 0 18px}
.cat-head{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin:0 0 6px}
.pp{display:grid;grid-template-columns:22px 1fr;gap:8px;padding:9px 10px;border:1px solid var(--line);border-radius:8px;margin:0 0 6px;background:var(--panel)}
.pp.on{border-color:var(--accent);box-shadow:inset 3px 0 0 var(--accent)}
.pp .t{font-weight:500}
.pp .d{color:var(--muted);font-size:13.5px}
.pp textarea{margin-top:8px;min-height:44px;font-size:14px}
.opp{border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin:0 0 8px;background:var(--panel)}
.opp.on{border-color:var(--chance);box-shadow:inset 3px 0 0 var(--chance)}
.opp-head{display:grid;grid-template-columns:22px 1fr auto;gap:10px;align-items:start}
.scores{display:flex;flex-wrap:wrap;justify-content:flex-end;gap:4px 14px;font-size:13px;color:var(--muted);white-space:nowrap;max-width:330px}
.scores b{color:var(--ink);font-weight:600;font-variant-numeric:tabular-nums}
.drivers{font-size:13px;color:var(--muted);margin-top:2px}
.detail{margin:12px 0 0 32px;display:grid;gap:10px}
.sliders{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:8px 22px}
.slider{display:grid;grid-template-columns:1fr auto;gap:2px 10px;align-items:center;font-size:13.5px}
.slider input{grid-column:1/-1;width:100%;accent-color:var(--accent)}
.slider output{font-weight:600;font-variant-numeric:tabular-nums}
.risk{border:1px solid var(--line);border-radius:10px;padding:14px 16px;margin:0 0 10px;background:var(--panel);box-shadow:inset 3px 0 0 var(--risk)}
.risk-head{display:flex;gap:10px;align-items:center}
.risk-head .id{font-weight:600;color:var(--risk);min-width:28px}
.risk-head input{flex:1}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:4px 0 0}
.chip{border:1px solid var(--line);border-radius:999px;padding:3px 10px;font-size:13px;background:var(--panel);cursor:pointer}
.chip[aria-pressed="true"]{border-color:var(--ink);background:var(--soft);font-weight:500}
.chip.c[aria-pressed="true"]{border-color:var(--chance)}
.sub{font-size:13px;color:var(--muted);margin:10px 0 2px}
.empty{border:1px dashed var(--line);border-radius:10px;padding:18px;color:var(--muted)}
.navrow{display:flex;justify-content:space-between;gap:10px;margin-top:26px}
.maptitle{font-size:21px;font-weight:600;letter-spacing:-.01em;margin:0 0 4px}
.mapwrap{overflow-x:auto;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:8px}
.mapwrap svg{display:block;width:100%;min-width:680px;height:auto}
.toolbar{display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center;margin:0 0 12px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:6px;overflow:hidden}
.seg button{border:0;background:var(--panel);padding:5px 11px;font-size:13.5px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.prio{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin-top:16px}
@media (max-width:640px){.prio{grid-template-columns:1fr}}
.prio .panel{margin:0}
.prio ul{margin:6px 0 0;padding-left:18px}
.prio li{margin:0 0 6px;font-size:14px}
.prio .k{font-weight:600}
.dotc{color:var(--chance)}.dotr{color:var(--risk)}
@media (max-width:820px){
  .layout{grid-template-columns:1fr}
  .rail{position:static;padding:12px 12px 0;overflow-x:auto}
  .rail ol{display:flex;gap:4px}
  .rail a{grid-template-columns:24px auto;white-space:nowrap;padding:8px}
  .rail .meta{display:none}
  main{padding:20px 16px 48px}
  .detail{margin-left:0}
}
@media print{
  .top .actions,.rail,.toolbar,.navrow,.noprint{display:none!important}
  .layout{display:block}
  body{background:#fff}
  .mapwrap{border:0}
}
@media (prefers-reduced-motion:no-preference){.pp,.opp{transition:border-color .15s}}
</style>
</head>

<script>
const D = JSON.parse(document.getElementById('data').textContent);
const KEY = 'circularity-navigator-v1';
const STEPS = [
  { id: 'profil', t: 'Profil und Regulatorik' },

  { id: 'pilotlinie', t: 'Pilotlinie' },
  { id: 'chancen', t: 'Chancen' },
  { id: 'map', t: 'Chancen-Risiko-Map' },
];
const KRIT = [['Regulierungsdruck', 0.20], ['DfR-Hebel', 0.25], ['Datenlage', 0.20], ['Geschäftsmodell', 0.20], ['Umsetzbarkeit', 0.15]];
const SEITE = { Nachfrage: 'Nachfrageseite', Angebot: 'Angebotsseite', Lebenszyklus: 'Lebenszyklus' };
const KAT_CHANCEN = [['TBM', 'CE', 'SP'], ['TBM', 'CE', 'WM'], ['GP', 'C2C', 'CE'], ['GP', 'CE', 'IS'], ['GP', 'TBM', 'SP', 'FS'], ['GP', 'C2C', 'GSCM'], ['GSCM', 'GP', 'C2C']];

let S = fresh();
try { const raw = localStorage.getItem(KEY); if (raw) S = Object.assign(fresh(), JSON.parse(raw)); } catch (e) {}
Object.values(S.pains).forEach((v) => { if (v.p == null) v.p = 3; if (v.s == null) v.s = 3; });
delete S.risiken;
const save = () => { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {} };
const esc = (s) => String(s == null ? '' : s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const half = (v) => Math.round(v * 2) / 2;
const fmt = (v) => String(v).replace('.', ',');
const ppById = Object.fromEntries(D.painpoints.map((p) => [p.id, p]));
const chById = Object.fromEntries(D.chancen.map((c) => [c.code, c]));
const pilotName = () => { const l = S.linien.find((x) => x.id === S.pilot); return l && l.name ? l.name : ''; };

function relevanz() {
  const p = S.profil; let ch = p.ch, eu = p.eu; if (!ch && !eu) { ch = true; eu = true; }
  return D.vorgaben.map((v, i) => {
    const s = (2 * v.D + v.K + v.B + v.Z + v.N) / 30 * 100;
    const bed = !!v.bedingung && (v.bedingung === 'rep' ? p.ohnerep : !p[v.bedingung]);
    const reg = String(v.region);
    const mkt = !(reg === 'Global' || (reg.includes('CH') && ch) || (reg.includes('EU') && eu));
    let w = s; if (bed) w *= v.bedingung === 'mag' ? 0.5 : 0.3;
    if (mkt) w *= reg === 'CH' ? 0.3 : 0.55;
    return { v, i, wert: Math.round(w), aus: bed || mkt, bed, mkt };
  }).sort((a, b) => b.wert - a.wert || a.i - b.i).map((o, k) => Object.assign(o, { rang: k + 1 }));
}
const PILOT_CHANCEN = { 1: ['GP', 'C2C', 'EE'], 2: ['GSCM'], 3: ['TBM', 'GS', 'SP', 'FS'] };
const KAT_LOESUNG = [['TBM', 'GS', 'SP'], ['TBM', 'WM', 'CE'], ['GP', 'C2C', 'EE'], ['CE', 'GP', 'IS'], ['EE', 'GS', 'SP'], ['GSCM', 'GP'], ['GSCM', 'C2C']];
function potenzialBranche() {
  const sel = S.branche === 'alle' || S.branche == null ? null : +S.branche;
  const fs = sel === null ? D.faelle : D.faelle.filter((f) => f[0] === sel);
  const mit = (code) => fs.filter((f) => f[1].includes(code));
  const maxN = Math.max(1, ...D.chancen.map((c) => mit(c.code).length));
  const out = {};
  D.chancen.forEach((c) => {
    const cs = mit(c.code), k = cs.length;
    if (sel === null) { out[c.code] = { pot: c.potenzial, n: k }; return; }
    if (!k) { out[c.code] = { pot: Math.round(c.potenzial * 0.6), n: 0 }; return; }
    const bek = cs.filter((f) => f[2] >= 0);
    const avg = bek.length ? bek.reduce((sum, f) => sum + f[2], 0) / bek.length : 0;
    const E = 5 * Math.log(1 + k) / Math.log(1 + maxN), U = 5 * Math.max(0, 1 - avg / 3), M = 5 * cs.reduce((sum, f) => sum + f[3], 0) / k;
    const potB = (E + U + M) / 15 * 100;
    out[c.code] = { pot: Math.round((k * potB + c.potenzial) / (k + 1)), n: k };
  });
  return out;
}
function bonusPilot(code) {
  const l = S.linien.find((x) => x.id === S.pilot); if (!l) return 0;
  return Object.entries(PILOT_CHANCEN).reduce((sum, [i, list]) => sum + (list.includes(code) ? (l.s[+i] - 3) * 6 : 0), 0);
}
function bonusPains(code) {
  const n = painIds().filter((pid) => KAT_LOESUNG[ppById[pid].kat].includes(code)).length;
  return Math.min(15, n * 3);
}
function chancenWerte() {
  const R = Object.fromEntries(relevanz().map((o) => [o.v.id, o]));
  const PB = potenzialBranche();
  const raw = D.chancen.map((c) => {
    const zs = D.zuordnungen.filter((z) => z.chance === c.code && R[z.vorgabe]);
    const rw = zs.reduce((s, z) => s + z.staerke * R[z.vorgabe].wert / 100, 0);
    const treiber = zs.filter((z) => z.staerke >= 2 && !R[z.vorgabe].aus).map((z) => R[z.vorgabe]).sort((a, b) => b.wert - a.wert);
    return { c, rw, treiber };
  });
  const mx = Math.max(...raw.map((x) => x.rw)) || 1;
  return raw.map((x) => {
    const rueckenwind = Math.round(x.rw / mx * 100);
    const pb = PB[x.c.code], bPilot = bonusPilot(x.c.code), bPain = bonusPains(x.c.code);
    const vorschlag = clamp(Math.round(0.35 * rueckenwind + 0.65 * pb.pot + bPilot + bPain), 0, 100);
    return Object.assign(x, { rueckenwind, pot: pb.pot, nBranche: pb.n, bPilot, bPain, vorschlag, wDefault: clamp(half(vorschlag / 20), 1, 5), pDefault: clamp(half(x.c.machbar), 1, 5) });
  }).sort((a, b) => b.vorschlag - a.vorschlag);
}
const chanceIds = () => Object.keys(S.chancen);
const painIds = () => D.painpoints.map((p) => p.id).filter((id) => S.pains[id]);
const cLabel = (code) => 'C' + (chanceIds().indexOf(code) + 1);

/* ---------- Rail ---------- */
function stepMeta(id) {
  const nP = Object.keys(S.pains).length, nC = chanceIds().length;
  return {
    profil: S.firma ? S.firma : 'Firma und Markt',
    'pain-points': nP ? nP + ' ausgewählt' : 'Werden zu den Risiken',

    chancen: nC ? nC + ' ausgewählt' : 'Aus Regulatorik ableiten',
    map: nC + nP ? 'Prioritäten festlegen' : 'Erst Pain Points und Chancen',

}

    const sev = gef.length ? gef.reduce((sum, c) => sum + S.chancen[c].w, 0) / gef.length : 2;
    const names = grp.map((pid) => ppById[pid].name);
    return { typ: 'r', id: 'R' + (i + 1), kat: k, kurz: D.kategorien[k], konkret: names.join(', '), names, p: Math.round(clamp(2 + 3 * grp.length / total, 1, 5) * 10) / 10, v: clamp(Math.round(sev * 2) / 2, 1, 5), gefaehrdet: gef };
  });
  return { cs, rs };
}

}
function svgMap() {

  placed.push({ x1: L, x2: L + 120, y1: top - 32, y2: top - 12 }, { x1: X(3) + 8, x2: X(3) + 200, y1: top - 32, y2: top - 12 });
  placed.push({ x1: L, x2: L + 100, y1: H - 52, y2: H - 32 }, { x1: X(3) + 8, x2: X(3) + 140, y1: H - 52, y2: H - 32 });
  const overlap = (b, own) => placed.reduce((sum, q) => { if (q.owner === own) return sum; const w = Math.min(b.x2, q.x2 + 3) - Math.max(b.x1, q.x1 - 3), h = Math.min(b.y2, q.y2 + 2) - Math.max(b.y1, q.y1 - 2); return sum + (w > 0 && h > 0 ? w * h : 0); }, 0);

  s += `<text x="${L}" y="${H - 38}" fill="var(--muted)" font-weight="600">Beobachten</text><text x="${X(3) + 10}" y="${H - 38}" fill="var(--ink)" font-weight="600">Sofort absichern</text>`;
  s += `<text x="12" y="${Y('c', 3)}" fill="var(--chance)" font-weight="600" font-size="14">Chancen</text><text x="12" y="${Y('c', 3) + 17}" fill="var(--muted)" font-size="11.5">Wirkung ↑</text>`;
  s += `<text x="12" y="${Y('r', 3)}" fill="var(--risk)" font-weight="600" font-size="14">Risiken</text><text x="12" y="${Y('r', 3) + 17}" fill="var(--muted)" font-size="11.5">Schwere ↓</text>`;
  s += `<text x="${plotR}" y="${H - 12}" text-anchor="end" fill="var(--muted)" font-size="11.5">Eintrittswahrscheinlichkeit bzw. Umsetzbarkeit →</text>`;
  all.forEach((o) => { const col = o.typ === 'c' ? 'var(--chance)' : 'var(--risk)'; s += `<circle cx="${o.cx}" cy="${o.cy}" r="8" fill="${col}" fill-opacity=".88" stroke="${col}"><title>${esc(o.id + ' ' + o.konkret)}: ${o.typ === 'c' ? 'Wirkung' : 'Schwere'} ${fmt(o.v)}, ${o.typ === 'c' ? 'Umsetzbarkeit' : 'Wahrscheinlichkeit'} ${fmt(o.p)}</title></circle>`; });

  return `<h1 class="noprint">Chancen-Risiko-Map</h1>
  <div class="toolbar"><span class="note">Beschriftung</span><div class="seg"><button type="button" data-act="labels" data-v="kurz" aria-pressed="${S.labels === 'kurz'}">Kurzname</button><button type="button" data-act="labels" data-v="konkret" aria-pressed="${S.labels === 'konkret'}">Konkrete Massnahme</button></div><button class="btn small" type="button" data-act="print">Drucken oder als PDF sichern</button></div>
  <p class="maptitle" id="maptitle">${esc(title)}</p><p class="note" style="margin:0 0 10px">${esc(sub ? sub + ' – ' : '')}${cs.length} Chancen (grün) und ${rs.length} Risiken (rot), Bewertung 1–5</p>
  <div class="mapwrap">${svgMap()}</div>
  <div class="prio">
    <div class="panel"><h3>Option prüfen</h3><ul>${cl((o) => o.p < 3)}</ul></div>
    <div class="panel"><h3>Priorisieren und umsetzen</h3><ul>${cl((o) => o.p >= 3)}</ul></div>
    <div class="panel"><h3>Beobachten</h3><ul>${rl((o) => o.p < 3)}</ul></div>
    <div class="panel"><h3>Sofort absichern</h3><ul>${rl((o) => o.p >= 3)}</ul></div>
  </div>
  ${navRow(4)}`;
}

/* ---------- Render & Routing ---------- */
const VIEWS = { profil: vProfil, 'pain-points': vPains, pilotlinie: vLinien, chancen: vChancen, map: vMap };
function render(keepScroll) {
  const y = window.scrollY;
  document.getElementById('main').innerHTML = VIEWS[S.step]();
  renderRail();
  if (keepScroll) window.scrollTo(0, y);
}
function route() {
  const h = location.hash.slice(1);
  S.step = VIEWS[h] ? h : (S.step && VIEWS[S.step] ? S.step : 'profil');
  save(); render(); window.scrollTo(0, 0);
}
window.addEventListener('hashchange', route);
const upd = (keep = true) => { save(); render(keep); };

/* ---------- Beispiel BERNINA ---------- */
function beispiel() {
  const pid = (name) => (D.painpoints.find((p) => p.name === name) || {}).id;
  const notes = {
    'Datenschutzbedenken': 'Vernetzte Maschinen speichern eigene Stickmuster und WLAN-Zugangsdaten; Kundinnen geben Geräte ungern zurück',
    'Fehlendes kreislauffähiges Design': 'Heutige Gehäuse und Baugruppen sind auf Präzision, nicht auf Demontage ausgelegt',
    'Einschränkende Produktanforderungen': 'Präzision, Laufruhe und Sicherheitsnormen begrenzen Rezyklat und lösbare Verbindungen',
    'Preisaufschlag': 'Rezyklat und Mehraufwand für Demontage erhöhen Herstellkosten',
    'Begrenzte Ressourcen': 'Entwicklungskapazität und Personal für Datenpflege sind knapp',
    'Ungleiche Marktmacht': 'Wenig Einfluss auf grosse Elektronik- und Motorenlieferanten; Preisdruck asiatischer Anbieter',
    'Kurzfristige, gewinnorientierte Denkweise': 'Kreislaufmassnahmen amortisieren sich über Gerätelebensdauern von 10+ Jahren',
    'Keine Bereitschaft zu Zielkonflikten': 'Zielkonflikt Design-Ästhetik und Präzision gegen Demontierbarkeit',
    'Fehlendes Wissen': 'Wenig Erfahrung mit Design for Recycling und Rezyklatqualitäten',
    'Fehlende Rückverfolgbarkeit': 'Unklar, wo Altgeräte landen (Vertrieb in über 80 Ländern)',
    'Fragmentierte, unstrukturierte Produktdaten': 'Materialinformationen stecken in Zeichnungen, Stücklisten und Lieferantendokumenten',
    'Hoher interner Koordinationsaufwand': 'Entwicklung Steckborn, Produktion Thailand und Logistik Appenweier müssen Daten abstimmen',
    'Komplexe Lebenszyklus-Datenpflege': 'Reparaturen bei Händlern werden nicht zentral erfasst',
    'Begrenzte Lieferantendaten': 'Stoff- und Rezyklatangaben zu Platinen, Motoren und Kunststoffen fehlen',
    'Hürden beim Datenaustausch': 'Lieferanten und Händler zögern, Daten weiterzugeben (Haftung, Geschäftsgeheimnis)',
  };
  const werte = { 'Datenschutzbedenken': [2.5, 3], 'Fehlende Rückverfolgbarkeit': [2, 3.5], 'Fehlendes kreislauffähiges Design': [4, 5], 'Einschränkende Produktanforderungen': [3.5, 5], 'Keine Bereitschaft zu Zielkonflikten': [3, 4], 'Preisaufschlag': [3.5, 4], 'Kurzfristige, gewinnorientierte Denkweise': [2.5, 4], 'Begrenzte Ressourcen': [4.5, 4], 'Fragmentierte, unstrukturierte Produktdaten': [4.5, 3.5], 'Hoher interner Koordinationsaufwand': [4, 3.5], 'Komplexe Lebenszyklus-Datenpflege': [3.5, 3], 'Ungleiche Marktmacht': [3, 3], 'Begrenzte Lieferantendaten': [4, 3], 'Hürden beim Datenaustausch': [4, 2.5], 'Fehlendes Wissen': [4, 2] };
  const s = fresh();
  s.firma = 'BERNINA International AG';
  s.branche = String(D.branchen.indexOf('Elektronik und Geräte'));
  s.profil = { ee: true, bat: false, mag: false, ohnerep: true, ch: true, eu: true };
  Object.entries(notes).forEach(([n, t]) => { s.pains[pid(n)] = { note: t, p: werte[n][0], s: werte[n][1] }; });
  s.linien = [['7-Serie (Mittel- bis Oberklasse)', [4, 4, 4, 4, 4]], ['Q-Serie Longarm (Prosumer)', [3, 3, 4, 4, 3]], ['3-Serie (neu seit 2025)', [4, 2, 4, 2, 4]], ['B 990 (Flaggschiff seit 2024)', [3, 2, 3, 5, 2]], ['Overlocker L 6 (neu seit 2026)', [3, 2, 4, 2, 4]], ['bernette (Zweitmarke)', [4, 1, 1, 1, 2]]].map(([name, sc], i) => ({ id: 'l' + (i + 1), name, s: sc }));
  s.pilot = 'l1';
  [['GP', 'Nachfolgegeneration mit konsequent verschraubtem Gehäuse, sortenreinen Kunststoffen und gut zugänglicher Hauptplatine', 5, 4], ['TBM', 'Inzahlungnahme beim Fachhändler und zertifiziert generalüberholte Geräte', 4, 3.5], ['GS', 'Service- und Reparaturpakete über das Händlernetz; Nähfuss-Kompatibilität als Verkaufsargument', 3, 5], ['GSCM', 'Datenblatt nach ISO 59040 für die 7-Serie, Material- und Stoffdaten der Lieferanten', 3.5, 4], ['CE', 'Metallchassis und Motoren aus Rückläufern sortenrein zurückgewinnen', 3, 2.5], ['SP', 'Mietmodell für Nähschulen und Kursanbieter über Händler', 2, 1.5], ['EE', 'Weniger Material in Gehäuse, Zubehör und Verpackung', 1.5, 4.5]].forEach(([c, k, w, p]) => { s.chancen[c] = { konkret: k, w, p }; });
  s.seq = 20; s.step = 'map'; s.labels = 'kurz';
  return s;
}

/* ---------- Events ---------- */
document.addEventListener('click', (e) => {
  const t = e.target.closest('[data-act]'); if (!t) return;
  const a = t.dataset.act, id = t.dataset.id;
  if (a === 'beispiel') { S = beispiel(); save(); if (location.hash === '#map') render(); else location.hash = 'map'; return; }
  if (a === 'reset') { S = fresh(); save(); if (location.hash === '#profil') render(); else location.hash = 'profil'; return; }
  if (a === 'typisch') { TYPISCH.forEach((n) => { const p = D.painpoints.find((x) => x.name === n); if (p && !S.pains[p.id]) S.pains[p.id] = { note: '', p: 3, s: 3 }; }); return upd(); }
  if (a === 'painsclear') { S.pains = {}; return upd(); }
  if (a === 'linieadd') { S.linien.push({ id: 'l' + (S.seq++), name: '', s: [3, 3, 3, 3, 3] }); if (!S.pilot) S.pilot = S.linien[0].id; return upd(); }
  if (a === 'liniedel') { S.linien = S.linien.filter((l) => l.id !== id); if (S.pilot === id) S.pilot = S.linien[0] ? S.linien[0].id : null; return upd(); }
  if (a === 'chancentop') { chancenWerte().slice(0, 7).forEach((x) => { if (!S.chancen[x.c.code]) S.chancen[x.c.code] = { konkret: '', w: x.wDefault, p: x.pDefault }; }); return upd(); }
  if (a === 'chancenclear') { S.chancen = {}; return upd(); }
  if (a === 'labels') { S.labels = t.dataset.v; return upd(); }
  if (a === 'print') { try { window.print(); } catch (err) {} return; }
});
document.addEventListener('change', (e) => {
  const t = e.target; const a = t.dataset && t.dataset.act; if (!a) return; const id = t.dataset.id;
  if (a === 'profil') { S.profil[t.dataset.k] = t.checked; return upd(); }
  if (a === 'branche') { S.branche = t.value; return upd(); }
  if (a === 'pain') { if (t.checked) S.pains[id] = { note: '', p: 3, s: 3 }; else delete S.pains[id]; return upd(); }
  if (a === 'pilot') { S.pilot = id; return upd(); }
  if (a === 'linienwert') { const l = S.linien.find((x) => x.id === id); l.s[+t.dataset.i] = +t.value; return upd(); }
  if (a === 'chance') {
    if (t.checked) { const x = chancenWerte().find((y) => y.c.code === id); S.chancen[id] = { konkret: '', w: x.wDefault, p: x.pDefault }; }
    else delete S.chancen[id];
    return upd();
  }
});
document.addEventListener('input', (e) => {
  const t = e.target; const a = t.dataset && t.dataset.act; if (!a) return; const id = t.dataset.id;
  if (a === 'firma') { S.firma = t.value; save(); renderRail(); return; }
  if (a === 'painnote') { S.pains[id].note = t.value; save(); return; }
  if (a === 'linienname') { S.linien.find((x) => x.id === id).name = t.value; save(); renderRail(); return; }
  if (a === 'ckonkret') { S.chancen[id].konkret = t.value; save(); return; }
  if (a === 'cw' || a === 'cp') { S.chancen[id][a === 'cw' ? 'w' : 'p'] = +t.value; document.getElementById(a + '-' + id).textContent = fmt(+t.value); save(); return; }
  if (a === 'ppp' || a === 'pps') { const k = a === 'ppp' ? 'p' : 's'; S.pains[id][k] = +t.value; document.getElementById('pp-' + k + '-' + id).textContent = fmt(+t.value); save(); return; }
});
route();
</script>
</body>
</html>
